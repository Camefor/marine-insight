name: .NET

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 10.0.x

            - name: Restore
              run: dotnet restore MarineInsight.slnx

            - name: Build
              run: dotnet build MarineInsight.slnx --no-restore --configuration Release

            - name: Test
              run: dotnet test MarineInsight.slnx --no-build --configuration Release --logger trx
